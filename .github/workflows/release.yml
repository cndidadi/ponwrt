name: Build PonWrt (Airoha AN7581)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare build environment
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          temp-reserve-mb: 100
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Get source code
        uses: actions/checkout@v5
        with:
          repository: pbs05/ponwrt
          ref: master
          path: src

      - name: install feeds
        working-directory: src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy config
        working-directory: src
        run: cp ../.config .config

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v6
        with:
          path: |
            src/staging_dir/toolchain-*
            src/staging_dir/host
            src/staging_dir/hostpkg
          key: ponwrt-toolchain-${{ runner.os }}-${{ hashFiles('src/.config') }}
          restore-keys: |
            ponwrt-toolchain-${{ runner.os }}-

      - name: Restore dl cache
        uses: actions/cache/restore@v6
        with:
          path: src/dl
          key: ponwrt-dl-${{ runner.os }}-${{ hashFiles('src/.config') }}
          restore-keys: |
            ponwrt-dl-${{ runner.os }}-

      - name: Build firmware
        working-directory: src
        run: |
          make clean
          make defconfig
          make -j$(nproc)

      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            src/staging_dir/toolchain-*
            src/staging_dir/host
            src/staging_dir/hostpkg
          key: ponwrt-toolchain-${{ runner.os }}-${{ hashFiles('src/.config') }}

      - name: Save dl cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: src/dl
          key: ponwrt-dl-${{ runner.os }}-${{ hashFiles('src/.config') }}

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ponwrt-an7581
          path: src/bin/targets/airoha/an7581/*
          if-no-files-found: error
          compression-level: 9
